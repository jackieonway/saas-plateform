[package]
name = "oauth-playground-api"
version = "1.0.0"
edition = "2021"
description = "Independent, session-bound OAuth demonstration API"
license = "MIT"

[lib]
name = "oauth_playground"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
