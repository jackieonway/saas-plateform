# Independent OAuth rehearsal deployment; only the HTTPS edge publishes ports.
# API has egress to the configured platform, no DB and no public port.
services:
  oauth-api:
    image: ${OAUTH_API_IMAGE:?Set the approved Rust API image digest}
    env_file:
      - path: ${OAUTH_API_ENV_FILE:?Set an absolute private API env file}
        required: true
    environment:
      OAUTH_BIND_ADDR: 0.0.0.0:3011
    expose: ["3011"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [oauth-private]
  oauth-web:
    image: ${OAUTH_FRONTEND_IMAGE:?Set the approved static frontend image digest}
    user: "101:101"
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [oauth-private]
  oauth-edge:
    image: ${OAUTH_EDGE_IMAGE:?Set the approved independent Nginx image digest}
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports: ["${OAUTH_HTTP_PORT:-80}:8080", "${OAUTH_HTTPS_PORT:-443}:8443"]
    volumes:
      - type: bind
        source: ${OAUTH_EDGE_CONFIG_FILE:?Set the rendered absolute Nginx config path}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OAUTH_TLS_CERTIFICATE_FILE:?Set the absolute public certificate chain path}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OAUTH_TLS_PRIVATE_KEY_FILE:?Set the absolute private TLS key path}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      oauth-api: {condition: service_healthy}
      oauth-web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [oauth-private]
networks:
  oauth-private:
    driver: bridge

