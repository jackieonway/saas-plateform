# Dante Cloud — docker-compose 生产部署
# 用法:
#   1. (可选) 在项目根目录创建 .env.docker 设置 JWT_SECRET / PUBLIC_APP_URL / 预检来源
#   2. docker compose --env-file .env.docker up -d --build（没有该文件时省略 --env-file）
#   3. 访问 http://<主机IP>/  (默认账号 admin / admin123, 请立即修改)
#
# 架构:
#   [ caddy(web) :80/:443 ] ──/api,/oauth──> [ backend(Rust/Axum) :3001 ] ──> [ postgres :5432 ]
#        └── 静态托管前端 SPA (frontend/dist 构建产物)
#        └──/socket.io/──> [ notification-ws(Node24) :3003 ] ──> PostgreSQL + 平台会话校验
#
# 备选「Rust 后端直接托管前端」单进程模式(不用 caddy):
#   docker compose up -d --build postgres backend
#   cd frontend && bun run build && STATIC_DIR=./dist BIND_ADDR=0.0.0.0:3001 cargo run
#   (backend 检测到 STATIC_DIR 后会自动托管静态文件并把 /api /oauth 一起服务)

services:
  postgres:
    image: postgres:17-alpine
    container_name: dante-postgres
    environment:
      POSTGRES_USER: dante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dante_cloud_2024}
      POSTGRES_DB: dante_cloud
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dante -d dante_cloud"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dante-backend
    environment:
      DATABASE_URL: postgres://dante:${POSTGRES_PASSWORD:-dante_cloud_2024}@postgres:5432/dante_cloud
      BIND_ADDR: 0.0.0.0:3001
      # 生产必须修改 JWT 密钥!
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-random-32bytes}
      # 对外基础地址(影响 OAuth 发现文档 issuer 与 authorize 跳转), 留空则按请求 Host 推断
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # 默认本地开发环境使用容器网络内的同源 web 网关预检。
      # production 要求 HTTPS；部署到生产时必须设为外部可达的 HTTPS 网关 origin。
      APPLICATION_ENVIRONMENT: ${APPLICATION_ENVIRONMENT:-development}
      MICRO_GATEWAY_ORIGIN: ${MICRO_GATEWAY_ORIGIN:-http://web}
      # 空值由后端按 MICRO_GATEWAY_ORIGIN 推导；追加 CDN 时填精确 origin 列表。
      MICRO_ALLOWED_ORIGINS: ${MICRO_ALLOWED_ORIGINS:-}
      SESSION_TTL_HOURS: 12
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    # 数据库迁移与种子在启动时自动执行(幂等)
    restart: unless-stopped

  notification-ws:
    build:
      context: ./mini-services/notification-ws
      dockerfile: Dockerfile
    container_name: dante-notification-ws
    environment:
      # 生产可用单独只读账号覆盖；此服务不接收或持有 JWT_SECRET。
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-postgres://dante:${POSTGRES_PASSWORD:-dante_cloud_2024}@postgres:5432/dante_cloud}
      PLATFORM_API_BASE_URL: http://backend:3001
      NOTIFICATION_PORT: 3003
      NOTIFICATION_HOST: 0.0.0.0
      NOTIFICATION_SOCKET_PATH: /socket.io/
      # 精确浏览器 origin，端口/协议必须一致；生产应显式配置。
      NOTIFICATION_ALLOWED_ORIGINS: ${NOTIFICATION_ALLOWED_ORIGINS:-${PUBLIC_APP_URL:-http://localhost}}
      NOTIFICATION_AUTH_TIMEOUT_MS: ${NOTIFICATION_AUTH_TIMEOUT_MS:-2000}
      NOTIFICATION_AUTH_RECHECK_MS: ${NOTIFICATION_AUTH_RECHECK_MS:-30000}
      NOTIFICATION_AUTH_WAIT_MS: ${NOTIFICATION_AUTH_WAIT_MS:-10000}
      NOTIFICATION_HEALTH_PROBE_MS: ${NOTIFICATION_HEALTH_PROBE_MS:-5000}
      NOTIFICATION_DATABASE_RETRY_MS: ${NOTIFICATION_DATABASE_RETRY_MS:-1000}
    expose:
      - "3003"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    # Dockerfile /health 就绪探针检查 DB schema、LISTEN、平台保护路由。
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dante-web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # 独立发布版本，不进入宿主镜像；web 容器只能读取。
      - type: bind
        source: ${MICRO_APPS_DIR:-./deploy/micro-apps}
        target: /micro-apps
        read_only: true
        bind:
          create_host_path: true
      # Caddy 原生 HTTPS 时另加 443:443 端口与 /data、/config 持久卷。
    depends_on:
      - backend
      - notification-ws
    restart: unless-stopped

volumes:
  pgdata:
