# Production configuration. No demonstration credentials or HTTP fallback.
# Copy deploy/compose.env.example to an ignored 0600 environment file and fill
# every required secret/origin. See docs/production-runbook.md for rollout.
# docker compose --env-file /secure/dante.env config --quiet
# docker compose --env-file /secure/dante.env --profile work-orders up -d --build
# Container execution must be validated on the target Docker runner.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-dante_cloud}
      TZ: Asia/Shanghai
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [services]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      APP_ENV: production
      APPLICATION_ENVIRONMENT: production
      DATABASE_URL: ${PLATFORM_DATABASE_URL:?Set the platform database URL}
      AUTO_CREATE_DATABASE: "false"
      BIND_ADDR: 0.0.0.0:3001
      JWT_SECRET: ${JWT_SECRET:?Set a fresh random signing key}
      METRICS_TOKEN: ${PLATFORM_METRICS_TOKEN:?Set an independent metrics token}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set the initial administrator name}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set the initial administrator password}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the exact public HTTPS origin}
      MICRO_GATEWAY_ORIGIN: ${PUBLIC_APP_URL:?Set the exact public HTTPS origin}
      MICRO_ALLOWED_ORIGINS: ${MICRO_ALLOWED_ORIGINS:-${PUBLIC_APP_URL}}
      MICRO_APPS_DIR: /micro-apps
      CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL}
      TRUSTED_PROXY_IPS: ${WEB_PROXY_IP:-172.30.0.10}
      OAUTH_INTROSPECTION_CLIENT_REQUESTS_PER_MINUTE: ${OAUTH_INTROSPECTION_CLIENT_REQUESTS_PER_MINUTE:-600}
      OAUTH_AUTH_FAILURE_REQUESTS_PER_MINUTE: ${OAUTH_AUTH_FAILURE_REQUESTS_PER_MINUTE:-30}
      OAUTH_AUTO_PURGE: "false"
      RUST_LOG: info
    depends_on: {postgres: {condition: service_healthy}}
    expose: ["3001"]
    read_only: true
    volumes:
      - type: bind
        source: ${MICRO_APPS_DIR:?Set a persistent absolute micro-apps directory outside the frontend checkout}
        target: /micro-apps
        bind: {create_host_path: false}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [services]
  notification-ws:
    build: {context: ./mini-services/notification-ws, dockerfile: Dockerfile}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?Set the notification read LISTEN database URL}
      PLATFORM_API_BASE_URL: ${PUBLIC_APP_URL}
      METRICS_TOKEN: ${NOTIFICATION_METRICS_TOKEN:?Set an independent metrics token}
      NOTIFICATION_HOST: 0.0.0.0
      NOTIFICATION_PORT: 3003
      NOTIFICATION_SOCKET_PATH: /socket.io/
      NOTIFICATION_ALLOWED_ORIGINS: ${PUBLIC_APP_URL}
      NOTIFICATION_AUTH_TIMEOUT_MS: ${NOTIFICATION_AUTH_TIMEOUT_MS:-2000}
      NOTIFICATION_AUTH_RECHECK_MS: ${NOTIFICATION_AUTH_RECHECK_MS:-30000}
      NOTIFICATION_AUTH_WAIT_MS: ${NOTIFICATION_AUTH_WAIT_MS:-10000}
      NOTIFICATION_HEALTH_PROBE_MS: ${NOTIFICATION_HEALTH_PROBE_MS:-5000}
      NOTIFICATION_DATABASE_RETRY_MS: ${NOTIFICATION_DATABASE_RETRY_MS:-1000}
    depends_on: {backend: {condition: service_healthy}, postgres: {condition: service_healthy}}
    expose: ["3003"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [services]
  work-orders-postgres:
    profiles: [work-orders-local-db]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: work_orders
      POSTGRES_PASSWORD: ${WORK_ORDERS_POSTGRES_PASSWORD:?Set a distinct business database password}
      POSTGRES_DB: work_orders
      TZ: Asia/Shanghai
    volumes: ["work_orders_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_orders -d work_orders"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [services]
  work-orders-api:
    profiles: [work-orders]
    build: {context: ./business-apps/work-orders/backend, dockerfile: Dockerfile}
    environment:
      NODE_ENV: production
      WORK_ORDERS_DATABASE_URL: ${WORK_ORDERS_DATABASE_URL:?Set the independent business database URL}
      PLATFORM_API_ORIGIN: ${PUBLIC_APP_URL}
      PLATFORM_CLIENT_ID: ${WORK_ORDERS_PLATFORM_CLIENT_ID:?Set the explicitly associated confidential client}
      PLATFORM_CLIENT_SECRET: ${WORK_ORDERS_PLATFORM_CLIENT_SECRET:?Set its confidential client secret}
      METRICS_TOKEN: ${WORK_ORDERS_METRICS_TOKEN:?Set an independent metrics token}
      WORK_ORDERS_HOST: 0.0.0.0
      WORK_ORDERS_PORT: 3004
      WORK_ORDERS_ALLOWED_ORIGINS: "null"
      PLATFORM_AUTH_TIMEOUT_MS: ${WORK_ORDERS_PLATFORM_AUTH_TIMEOUT_MS:-3000}
    depends_on: {work-orders-postgres: {condition: service_healthy, required: false}}
    expose: ["3004"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [services]
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the exact public HTTPS origin}
      PUBLIC_SOCKET_ORIGIN: ${PUBLIC_SOCKET_ORIGIN:?Set the matching exact WSS origin}
      MICRO_FRAME_ORIGINS: ${MICRO_FRAME_ORIGINS:-}
      MICRO_TRUSTED_SCRIPT_ORIGINS: ${MICRO_TRUSTED_SCRIPT_ORIGINS:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - type: bind
        source: ${MICRO_APPS_DIR:?Set a persistent absolute micro-apps directory outside the frontend checkout}
        target: /micro-apps
        read_only: true
        bind: {create_host_path: false}
      - caddy_data:/data
      - caddy_config:/config
    # Notification readiness probes the public HTTPS platform through this
    # gateway. Start its listener first, then let health converge after TLS is
    # available; waiting for notification health here would deadlock startup.
    depends_on: {backend: {condition: service_healthy}, notification-ws: {condition: service_started}}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${WEB_PROXY_IP:-172.30.0.10}"}
networks:
  services:
    ipam: {config: [{subnet: "${SERVICE_SUBNET:-172.30.0.0/24}"}]}
volumes:
  pgdata:
  work_orders_pgdata:
  caddy_data:
  caddy_config:
