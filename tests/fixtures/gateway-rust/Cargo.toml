[package]
name = "gateway-rust-transport-fixture"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-only HTTP and WebSocket peer for the Phase 3 Nginx gateway checks"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
strip = true
