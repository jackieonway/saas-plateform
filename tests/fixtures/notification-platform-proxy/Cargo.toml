[package]
name = "phase23-notification-platform-proxy"
version = "0.1.0"
edition = "2021"
publish = false
description = "Loopback-only test proxy that delays real platform socket-context checks"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
