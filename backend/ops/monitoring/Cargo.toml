[package]
name = "saas-monitor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Private fixed-target health probes and transition-only local operational events"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
strip = "debuginfo"
debug = 0
