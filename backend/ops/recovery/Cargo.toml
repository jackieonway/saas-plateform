[package]
name = "saas-recovery"
version = "0.1.0"
edition = "2021"
publish = false
description = "Coordinated PostgreSQL backup and authenticated snapshot verification"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
uuid = { version = "1", features = ["v7", "serde"] }
ring = "0.17"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.dev]
incremental = false
debug = 1

[profile.test]
debug = 1
incremental = false

[profile.release]
strip = "debuginfo"
debug = 0
