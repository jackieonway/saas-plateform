[package]
name = "saas-artifact-agent"
version = "0.1.0"
edition = "2024"
publish = false
description = "Authenticated immutable static-artifact installation on one configured node"

[dependencies]
deployment-contract = { path = "../../crates/deployment-contract" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[profile.dev]
debug = 1
