[package]
name = "deployment-contract"
version = "0.1.0"
edition = "2024"
publish = false
description = "Closed platform-to-agent deployment messages and identity policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
strip = "debuginfo"
debug = 0
