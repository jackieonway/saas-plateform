[package]
name = "saas-platform-backend"
default-run = "saas-platform-backend"
version = "1.0.0"
edition = "2021"
description = "SaaS Platform 多租户多组织权限平台 Rust 后端 (Axum + SQLx + PostgreSQL)"

[dependencies]
operational-telemetry = { path = "./crates/operational-telemetry" }
deployment-contract = { path = "./crates/deployment-contract" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
# Existing locked TLS/JWT dependency; mature AEAD for recoverable server-only tokens.
ring = "0.17.14"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# std::fs::rename may replace an existing directory; Linux needs RENAME_NOREPLACE.
# rustix is already present in the locked dependency graph.
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.dev]
opt-level = 0
debug = 1
