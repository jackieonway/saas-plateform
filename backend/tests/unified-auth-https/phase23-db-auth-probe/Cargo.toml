[package]
name = "phase23-db-auth-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tokio = { version = "=1.53.3", features = ["macros", "rt", "time"] }

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
strip = "debuginfo"
debug = 0
