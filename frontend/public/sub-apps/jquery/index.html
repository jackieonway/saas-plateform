<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>micro-jquery · Dante Cloud 遗留系统子应用</title>
  <!--
    本页是「仿乾坤」微前端的遗留子应用 HTML 入口, 支持两种伺服形态 (Task 23 双形态):
    - 开发形态: 启动 mini-services/micro-jquery (3006), 主应用 entry_url=/sub/jquery/,
      经 Vite 代理拉取本页 (去前缀转发);
    - 生产/静态形态 (当前默认): 本目录文件同步至 frontend/public/sub-apps/jquery/,
      entry_url=/sub-apps/jquery/index.html, 由主应用静态伺服直接返回 ——
      挂载不依赖任何子应用进程/端口, 等价于线上 nginx 静态目录或 CDN 部署;
    - 资源一律用**相对路径**(相对入口基址解析: new URL(src, '/sub-apps/jquery/index.html')
      → /sub-apps/jquery/vendor/...), 根绝对路径会被 new URL 压过基址打到主应用根,
      被 Vite SPA fallback 吞掉(乾坤生态同款约定: publicPath 用 './');
    - 生命周期契约 window.__DANTE_MICRO_APP__ = { name, mount(container, props), unmount() }
      实现在 app.js，消费 MicroProps 2.0，update(props) 更新完整上下文并取消旧请求;
    - 子应用在主应用 realm 内执行, fetch('/api/...') 即同源主应用请求。
  -->
</head>
<body>
  <div id="app"></div>
  <script src="vendor/jquery.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
