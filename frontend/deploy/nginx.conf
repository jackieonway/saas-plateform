worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $host_file_cache {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        /release-metadata.json "no-store";
        /healthz "no-store";
    }
    map $status $host_response_cache {
        default "no-store";
        200 $host_file_cache;
        304 $host_file_cache;
    }
    map $http_accept $accepts_html {
        default 0;
        "~*(?:^|,)\s*text/html(?:\s*;[^,]*)?(?:,|$)" 1;
    }
    map $http_accept $refuses_html {
        default 0;
        "~*(?:^|,)\s*text/html\s*;[^,]*\bq=0(?:\.0*)?(?:\s*;|\s*,|\s*$)" 1;
    }
    # Keep this list aligned with frontend/src/App.tsx. File-like requests and
    # every API, dev-server and microapp path remain outside the SPA fallback.
    map $uri $host_navigation {
        default 0;
        / 1;
        ~^/(?:login|device|consent|dashboard|profile|embed)/?$ 1;
        ~^/(?:system|athena|hermes|micro)(?:/[^./]+)*/?$ 1;
    }
    map "$request_method:$accepts_html:$refuses_html:$host_navigation" $allow_host_navigation {
        default 0;
        ~^(GET|HEAD):1:0:1$ 1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;
        disable_symlinks on;
        add_header Cache-Control $host_response_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        location = /healthz { return 200 "ok\n"; }
        location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
        location = /logo.svg { limit_except GET { deny all; } try_files $uri =404; }
        location = /robots.txt { limit_except GET { deny all; } try_files $uri =404; }
        location = /release-metadata.json { limit_except GET { deny all; } try_files $uri =404; }
        location ^~ /assets/ {
            limit_except GET { deny all; }
            try_files $uri =404;
            error_page 404 = @missing_host_asset;
        }
        # Dynamic imports must receive a real missing resource, never SPA HTML.
        location @missing_host_asset {
            types { }
            default_type text/plain;
            return 404 "Static resource not found\n";
        }

        # The gateway owns registered microapp routes and ZIP compatibility.
        # Nothing in the host image can activate a version merely by existing.
        location = /sub-apps { return 404; }
        location ^~ /sub-apps/ { return 404; }
        # The edge gateway routes registered URL resources to the Rust backend.
        location = /micro-proxy { return 404; }
        location ^~ /micro-proxy/ { return 404; }
        location = /assets { return 404; }
        location / {
            if ($allow_host_navigation = 0) { return 404; }
            rewrite ^ /index.html last;
        }
    }
}
