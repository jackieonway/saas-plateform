name: Independent application CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: node --test .github/tests/repository-structure.mjs .github/tests/sdk-consumer-contract.mjs backend/tests/nginx-render-policy.mjs
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run sdk:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
  operations:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool: [monitoring, recovery]
    defaults:
      run:
        working-directory: backend/ops/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo test --locked
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
          - name: backend
            context: backend
          - name: monitor
            context: backend/ops/monitoring
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build this repository image
        run: >-
          docker build --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg HOST_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          -t saas-${{ matrix.name }}:ci ${{ matrix.context }}
