name: Independent application CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: node --test .github/tests/repository-structure.mjs .github/tests/sdk-consumer-contract.mjs backend/tests/nginx-render-policy.mjs
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run sdk:check
      - run: npm run qiankun:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --manifest-path crates/deployment-contract/Cargo.toml
  backend-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: platform-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55494:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:platform-ci-only@127.0.0.1:55494/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - name: Record the owned PostgreSQL cluster fingerprint
        env:
          PGPASSWORD: platform-ci-only
        run: |
          cluster_id="$(psql --host=127.0.0.1 --port=55494 --username=postgres --dbname=postgres --no-psqlrc --tuples-only --no-align --command='SELECT system_identifier FROM pg_control_system()')"
          [[ "$cluster_id" =~ ^[1-9][0-9]*$ ]]
          echo "IDENTITY_PHASE24_TEST_CLUSTER_ID=$cluster_id" >> "$GITHUB_ENV"
      - name: OAuth issuance and revocation
        run: 'cargo test --locked --bin saas-platform-backend oauth_issuance_tests:: -- --ignored --test-threads=2'
      - name: OAuth administration and PKCE migration audit
        run: 'cargo test --locked --bin saas-platform-backend management_audit_tests::oauth_ -- --ignored --test-threads=1'
      - name: Entity creation and menu relationships
        run: 'cargo test --locked --bin saas-platform-backend entity_creation_tests:: -- --ignored --test-threads=2'
      - name: Platform bootstrap and contact uniqueness
        run: 'cargo test --locked --test platform_bootstrap --test contact_uniqueness -- --ignored --test-threads=1'
      - name: Notification publication and visibility
        run: 'cargo test --locked --bin saas-platform-backend notification_tests:: -- --ignored --test-threads=2'
      - name: Organization subtree reporting and search
        run: 'cargo test --locked --bin saas-platform-backend organization_subtree_reporting_tests:: -- --ignored --test-threads=2'
      - name: Role assignment membership and concurrency
        run: 'cargo test --locked --bin saas-platform-backend organization_subtree_user_role_tests:: -- --ignored --test-threads=2'
      - name: Region catalog atomic audit
        run: 'cargo test --locked --bin saas-platform-backend region_catalog_mutations_rollback_when_audit_is_rejected -- --ignored --test-threads=1'
      - name: Historical managed version readiness and cleanup
        run: 'cargo test --locked --bin saas-platform-backend release_tests::managed_gate:: -- --ignored --test-threads=1'
      - name: Canonical initialization and historical baseline upgrades
        run: 'cargo test --locked --bin saas-platform-backend release_tests::database_upgrade:: -- --ignored --test-threads=1'
      - name: Qiankun admission and historical release archives
        run: 'cargo test --locked --bin saas-platform-backend release_tests::qiankun_only:: -- --ignored --test-threads=1'
      - name: Environment URL entries and proxy configuration
        run: 'cargo test --locked --bin saas-platform-backend release_tests::url_entries:: -- --ignored --test-threads=1'
      - name: Release removal protections and audit
        run: 'cargo test --locked --bin saas-platform-backend release_tests::removal:: -- --ignored --test-threads=1'
      - name: Data grant changes and isolation
        run: 'cargo test --locked --bin saas-platform-backend data_grant_tests:: -- --ignored --test-threads=2'
      - name: Data grant discovery boundaries
        run: 'cargo test --locked --bin saas-platform-backend data_grant_discovery_tests:: -- --ignored --test-threads=2'
      - name: SSO BFF sessions, refresh, revocation and fail-closed authority
        env:
          IDENTITY_PHASE24_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: 'cargo test --locked --bin saas-platform-backend bff_tests:: -- --ignored --test-threads=2'
      - name: Authentication and platform ownership isolation
        env:
          IDENTITY_PHASE02_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          IDENTITY_PHASE12_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: 'cargo test --locked --bin saas-platform-backend identity_deployment_tests:: -- --ignored --test-threads=1'
      - name: Micro application setup and access
        run: 'cargo test --locked --bin saas-platform-backend routes::application_setup::tests:: -- --ignored --test-threads=2'
  operations:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool: [monitoring, recovery]
    defaults:
      run:
        working-directory: backend/ops/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo test --locked
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
          - name: backend
            context: backend
          - name: monitor
            context: backend/ops/monitoring
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build this repository image
        run: >-
          docker build --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg HOST_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          -t saas-${{ matrix.name }}:ci ${{ matrix.context }}
