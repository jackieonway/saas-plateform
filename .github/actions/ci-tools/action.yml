name: Declared CI tools
description: Install the repository Node, npm and Rust versions without personal cache paths
inputs:
  rust:
    description: Install the declared Rust toolchain
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install declared npm
      shell: bash
      run: npm install --global npm@11.16.0
    - name: Install declared Rust
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
        rustup default 1.97.0
