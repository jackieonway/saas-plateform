# Standalone example. Replace paths/host and configure HTTPS for production.
# Put mime.types beside this configuration, or use its installed absolute path.
# nginx -t -p /etc/nginx/ -c /path/to/deploy/nginx.conf
worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    # Standard mime.types may omit ESM and CommonJS build chunk extensions.
    types { application/javascript mjs cjs; }
    default_type application/octet-stream;
    sendfile on;

    # HTML (including directory index) is revalidated. Only successful immutable
    # version files receive the long cache lifetime; errors are never immutable.
    map "$status:$uri" $micro_cache_control {
        default "no-cache";
        ~^[45][0-9][0-9]: "no-store";
        ~*\.html?$ "no-cache";
        ~/$ "no-cache";
        ~^200:/sub-apps/[a-z0-9-]+/versions/[A-Za-z0-9._-]+/ "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        server_name localhost;
        root /srv/dante/frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /oauth/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Native static handling returns 404, never the host SPA, for missing
        # files. Regex alias uses captures so the independent root is preserved.
        location ~ ^/sub-apps/([a-z0-9-]+)/versions/([A-Za-z0-9._-]+)/(.*)$ {
            alias /srv/dante/micro-apps/$1/versions/$2/$3;
            add_header Cache-Control $micro_cache_control always;
            # Public build files only; opaque iframe ESM sends Origin: null.
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Existing unversioned entry files remain available during migration.
        location /sub-apps/ {
            try_files $uri $uri/ =404;
            add_header Cache-Control $micro_cache_control always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
