# Explicit ZIP compatibility override. No release volume in the base deployment.
# Use -f docker-compose.yml -f deploy/compose.zip.yml --profile zip.
services:
  backend:
    environment:
      MICRO_APPS_DIR: /micro-apps
    volumes:
      - type: bind
        source: ${MICRO_APPS_DIR:?Set a pre-created persistent absolute ZIP directory}
        target: /micro-apps
        bind: {create_host_path: false}
  micro-static:
    profiles: [zip]
    image: ${MICRO_STATIC_IMAGE:?Set the separate ZIP Nginx image digest}
    user: "101:101"
    expose: ["8080"]
    volumes:
      - type: bind
        source: ${MICRO_STATIC_CONFIG_FILE:?Set the rendered absolute ZIP config path}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MICRO_APPS_DIR}
        target: /micro-apps
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge]
