# Optional private collector; operator supplies real targets and separate tokens.
# This template does not start a service or configure an external receiver.
global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/saas-alerts.yml]
scrape_configs:
  - job_name: platform
    metrics_path: /api/internal/metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/platform-metrics}
    static_configs: [{targets: ['backend:3001']}]
  - job_name: work-orders
    metrics_path: /work-orders-api/internal/metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/work-orders-metrics}
    static_configs: [{targets: ['work-orders-api:3004']}]
  - job_name: stores
    metrics_path: /stores-api/internal/metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/stores-metrics}
    static_configs: [{targets: ['stores-api:3031']}]
  - job_name: notification
    metrics_path: /metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/notification-metrics}
    static_configs: [{targets: ['notification-ws:3003']}]
  - job_name: monitor
    metrics_path: /internal/metrics
    authorization: {type: Bearer, credentials_file: /run/secrets/monitor-metrics}
    static_configs: [{targets: ['monitor:9098']}]
